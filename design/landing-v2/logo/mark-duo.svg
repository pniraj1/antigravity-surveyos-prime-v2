<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Motor SurveyOS">
  <!-- MOTOR SURVEYOS — TWO-TONE MARK
       Bracket and monogram in ink; the field rule alone in oxide.

       This is the whole brand colour story in one 21×3px object: a form
       filled in black, ruled and attested in red. It is deliberately the
       smallest possible oxide surface — enough to own the colour, far too
       small to read as an alarm or as a deficit. Consistent with the two
       oxide rules in tokens.css.

       var() resolves when inlined in the page; the hex fallback covers
       standalone use via <img>, where custom properties do not reach. -->
  <g fill="none" stroke="currentColor" stroke-width="3.6"
     stroke-linecap="square" stroke-linejoin="miter">
    <path d="M19 8 H8 V56 H19"/>
    <path d="M45 8 H56 V56 H45"/>
    <path d="M21.5 40 V22.4 L32 32.6 L42.5 22.4 V40" stroke-width="4.2"/>
  </g>
  <rect x="21.5" y="45.4" width="21" height="3.1" fill="var(--accent, #B03C26)"/>
</svg>
